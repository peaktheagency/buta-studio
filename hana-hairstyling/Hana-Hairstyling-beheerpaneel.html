<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#172E34">
<title>Beheer · Hana Hairstyling</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--petrol:#24424A;--petrol-d:#172E34;--mist:#E4ECEB;--ivory:#F8F5F0;--paper:#FFFDF9;--stone:#EFEAE2;--line:#E3DCD1;--ink:#162024;--soft:#46545A;--gold:#B8914F;--gold-l:#D9BC7E;--red:#A2361B;--green:#2E6B4F;
 --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope","Helvetica Neue",Arial,sans-serif;
 --c-nails:#24424A;--c-lashes:#7A4E32;--c-face:#8C6A2E;--c-body:#3E5F4B;--c-wax:#6B4A63;--hr:64px}
:root{--petrol:#151311;--petrol-d:#0E0D0B;--mist:#EAE1D2;--ivory:#F4EFE7;--paper:#FFFCF7;--stone:#EFE8DC;--line:#E2D8C9;--ink:#151311;--soft:#5E574E;--gold:#A5803F;--gold-l:#D6BD8C;--serif:"Bodoni Moda","Didot",Georgia,serif;--sans:"Figtree","Avenir Next",Arial,sans-serif;--login-bg:radial-gradient(circle at 30% 18%,#2A2621,#0E0D0B 62%)}
.lmark{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px;color:#fff}.lmark svg{width:92px;height:92px}.lmark small{font-size:10px;letter-spacing:.34em;color:#D6BD8C}
*{box-sizing:border-box;font-variant-numeric:lining-nums}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:500 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--petrol);background:var(--petrol);color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--petrol-d)}
.btn.l{background:#fff;color:var(--petrol);border-color:var(--line)}.btn.l:hover{border-color:var(--petrol)}
.btn.g{background:var(--gold);border-color:var(--gold)}.btn.g:hover{background:#a37f43}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn.r{background:#fff;color:var(--red);border-color:#E7C9BE}
.btn.s{min-height:42px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.w100{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px;position:relative;background:var(--login-bg)}
#login:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(4,26,28,.35),rgba(4,22,24,.85))}
.lgw{position:relative;display:grid;justify-items:center;width:min(420px,100%)}
.neonS{font:400 64px/1 "Great Vibes",cursive;color:transparent;-webkit-text-stroke:1.6px #fff;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 20px rgba(150,255,235,.6));text-align:center;margin-bottom:22px}
.lg{background:var(--paper);border-radius:24px;padding:30px 24px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lg h1{font-size:32px}
.lg p{color:var(--soft);margin:4px 0 18px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.who button{min-height:74px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px}
.who button:hover{border-color:var(--petrol)}
.who button.own{grid-column:1/-1;flex-direction:row;gap:12px;min-height:60px;background:var(--mist);border-color:#cfdcda}
.who .av,.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 21px/1 "Great Vibes",cursive;background:linear-gradient(140deg,var(--gold-l),#f3e3c0);color:var(--petrol-d);flex:none}
.pinhd{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.pinhd b{font-size:18px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--petrol)}
.dots i.on{background:var(--petrol)}
.dots.bad{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{min-height:62px;border-radius:16px;border:1px solid var(--line);background:#fff;font:600 22px var(--sans);cursor:pointer}
.keys button:active{background:var(--mist)}
.lg small{display:block;margin-top:16px;color:var(--soft);font-size:13.5px}
.lnk{background:none;border:0;color:var(--petrol);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 4px;font-size:15px}
/* ---------- app ---------- */
#app{display:none;min-height:100%;grid-template-columns:248px 1fr}
#app.on{display:grid}
.sb{background:var(--petrol-d);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.sb:before{content:"";position:absolute;inset:0;background:var(--side-pat,none) 0 0/180px auto;opacity:.06;pointer-events:none;-webkit-mask:linear-gradient(transparent 40%,#000);mask:linear-gradient(transparent 40%,#000)}
.sb>*{position:relative}
.sb .br{display:flex;gap:12px;align-items:center;padding:4px 8px 14px}
.sb .br b{font:500 24px/1 var(--serif);display:block}
.sb .br small{font-size:10px;letter-spacing:.24em;opacity:.7}
.me{display:flex;gap:10px;align-items:center;margin:0 4px 14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:14px}
.me b{display:block;font-size:15px}
.me span{color:rgba(255,255,255,.7);font-size:12.5px}
.nb{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;font-weight:600;font-size:15px;width:100%}
.nb:hover{background:rgba(255,255,255,.07);color:#fff}
.nb[aria-current=page]{background:rgba(255,255,255,.13);color:#fff}
.nb svg{width:20px;height:20px;flex:none;opacity:.9}
.nb .ct{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;padding:1px 8px;font-size:12.5px;font-weight:800}
.sb .ft{margin-top:auto;padding:10px 12px;display:grid;gap:8px}
.sb .ft a,.sb .ft button{color:rgba(255,255,255,.85);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;font-size:14px}
.mn{min-width:0;padding:22px clamp(14px,2.5vw,32px) 120px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:clamp(30px,3.2vw,42px);margin-right:auto;line-height:1.1}
.top h1 small{display:block;font:700 12.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.dn{display:flex;gap:6px;align-items:center}
.dn input{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff}
.acts-top{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi span{font-size:13.5px;color:var(--soft);font-weight:700}
.kpi b{display:block;font:500 32px/1.1 var(--serif);margin-top:4px}
.kpi em{font-style:normal;font-size:13px;font-weight:700;color:var(--soft)}
.kpi em.up{color:var(--green)}.kpi em.dn{color:var(--red)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.card h2{font-size:26px;padding:18px 20px 4px}
.card .sub{padding:0 20px 12px;color:var(--soft);font-size:14.5px;margin:0}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.tools label{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--soft);cursor:pointer;font-weight:600}
.tools input[type=checkbox]{width:20px;height:20px;accent-color:var(--petrol)}
.seg{display:inline-flex;background:var(--stone);border-radius:12px;padding:3px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--soft)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
select.f,input.f{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-weight:600}
.srch{flex:1;min-width:200px;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
/* next-up banner */
.next{display:flex;gap:16px;align-items:center;background:var(--petrol);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.next:before{content:"";position:absolute;inset:0;background:var(--side-pat,none) 0 0/160px auto;opacity:.07;pointer-events:none}
.next>*{position:relative}
.next .t{font:500 34px/1 var(--serif);min-width:84px}
.next .i{flex:1;min-width:0}
.next .i small{display:block;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l)}
.next .i b{font-size:17px}
.next .i span{display:block;color:rgba(255,255,255,.8);font-size:14.5px}
@media(max-width:600px){.next{flex-wrap:wrap}.next .acts{width:100%}}
/* dag-lijst */
.dl{display:grid}
.it{display:grid;grid-template-columns:76px 6px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--stone)}
.it:last-child{border-bottom:0}
.it .tm{font-weight:800;font-size:17px;line-height:1.2}
.it .tm small{display:block;font-weight:600;color:var(--soft);font-size:13px}
.it .bar{align-self:stretch;border-radius:3px}
.it .nm{font-weight:800;font-size:16.5px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.it .nm:hover{text-decoration:underline}
.it .sv{color:var(--soft);font-size:14.5px}
.it .ia{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.it.done{background:rgba(228,236,235,.45)}
.it.past .tm{color:var(--soft)}
.it.gone{opacity:.55}
.it .note{display:block;font-size:13.5px;color:#7A3E1D;margin-top:2px}
@media(max-width:700px){.it{grid-template-columns:62px 5px 1fr;row-gap:10px}.it .ia{grid-column:1/-1;justify-content:flex-start}}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-bevestigd{background:var(--mist);color:var(--petrol)}.p-gekomen{background:#E3EFE7;color:var(--green)}.p-no-show{background:#F6E0D8;color:var(--red)}.p-geannuleerd,.p-geweigerd{background:var(--stone);color:var(--soft)}.p-aanvraag{background:#FBEFD9;color:#8A5A0A}
.flag{background:#F6E0D8;color:var(--red);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800;margin-left:6px}
.newb{background:var(--gold);color:#fff;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:800;margin-left:6px}
.empty{padding:40px 20px;text-align:center;color:var(--soft)}
.empty b{display:block;font:500 28px var(--serif);color:var(--ink);margin-bottom:4px}
/* timeline */
.tlw{overflow:auto;max-height:calc(100vh - 250px);min-height:420px;position:relative;border-radius:0 0 18px 18px}
.tl{display:grid;position:relative;min-width:100%}
.tl .hcol{position:sticky;left:0;z-index:4;background:var(--paper);border-right:1px solid var(--line)}
.tl .hh{height:var(--hr);font-size:12.5px;color:var(--soft);font-weight:700;padding:2px 8px 0 0;text-align:right;border-top:1px solid var(--line)}
.tl .shd{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);height:54px;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;font-size:14.5px;white-space:nowrap}
.tl .shd small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.tl .col{position:relative;border-right:1px solid var(--stone)}
.tl .cb{position:relative;cursor:copy}
.tl .gl{height:var(--hr);border-top:1px solid var(--stone)}
.tl .gl:nth-child(odd){background:rgba(239,234,226,.25)}
.ap{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 8px;color:#fff;font-size:13px;line-height:1.3;cursor:pointer;overflow:hidden;border:0;text-align:left;box-shadow:0 2px 8px rgba(23,46,52,.18);z-index:2}
.ap:hover{filter:brightness(1.08);z-index:3}
.ap b{display:block;font-size:13.5px}
.ap.st-gekomen{opacity:.55}
.ap.st-no-show{background:repeating-linear-gradient(45deg,#8a3a24,#8a3a24 6px,#9b4430 6px,#9b4430 12px)!important}
.ap.st-geannuleerd{display:none}
.ap .nw{position:absolute;top:5px;right:6px;background:var(--gold);border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:800}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;background:repeating-linear-gradient(-45deg,#e9e4dc,#e9e4dc 6px,#f3efe8 6px,#f3efe8 12px);color:var(--soft);font-size:12.5px;padding:5px 7px;font-weight:700;cursor:pointer;border:1px dashed #cfc6b8;text-align:left;z-index:2}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.hint{font-size:13.5px;color:var(--soft);padding:8px 14px;border-top:1px solid var(--line)}
/* lijsten */
.rows{display:grid}
.rw{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--stone);cursor:pointer;background:none;text-align:left;width:100%}
.rw:hover{background:var(--stone)}
.rw .tm{font-weight:800}
.rw .tm small{display:block;font-weight:600;color:var(--soft);font-size:13px}
.rw .nm{font-weight:800}
.rw .sv{color:var(--soft);font-size:14.5px}
@media(max-width:700px){.rw{grid-template-columns:80px 1fr}.rw>:last-child{grid-column:2}}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto}
.wd{border-right:1px solid var(--stone);min-height:300px}
.wd h3{font:700 14px var(--sans);padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;cursor:pointer}
.wd h3.td{color:var(--gold)}
.wd .wi{margin:6px;padding:8px 10px;border-radius:10px;color:#fff;font-size:13px;cursor:pointer;border:0;text-align:left;width:calc(100% - 12px);display:block}
.wd .wi b{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:24px 20px 6px}
.bars div{flex:1;background:var(--petrol);border-radius:6px 6px 2px 2px;position:relative;min-height:2px}
.bars div.pk{background:var(--gold)}
.bars div span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800}
.bl{display:flex;gap:6px;padding:0 20px 18px;font-size:12px;color:var(--soft)}
.bl span{flex:1;text-align:center}
.hb{padding:6px 20px 18px;display:grid;gap:10px}
.hb .r{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;font-size:14.5px}
.hb .r i{display:block;height:10px;border-radius:5px;background:var(--mist);margin-top:4px;overflow:hidden}
.hb .r i em{display:block;height:100%;background:var(--petrol);border-radius:5px}
.hb .r b{text-align:right}
.str{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--stone)}
.dd{display:flex;gap:4px;flex-wrap:wrap}
.dd label{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:38px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:700;background:#fff}
.dd input{position:absolute;opacity:0;pointer-events:none}
.dd label.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#cfc6b8;transition:background .2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--petrol)}.sw input:checked+span:after{transform:translateX(20px)}
.pinin{width:84px;min-height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-weight:700;letter-spacing:.2em;text-align:center}
/* help */
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.hc{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.hc .n{width:36px;height:36px;border-radius:50%;background:var(--petrol);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.hc h3{font-size:24px;margin-bottom:6px}
.hc p{margin:0;color:var(--soft);font-size:15px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(12,24,28,.45);z-index:50;display:none}
.scrim.on{display:block}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--paper);z-index:60;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drw.on{transform:none}
.drw .dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drw .dh h2{font-size:30px;flex:1;line-height:1.1}
.drw .db{flex:1;overflow:auto;padding:18px 20px 40px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:15px;margin-bottom:14px}
.kv span{color:var(--soft);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.sec h3{font:800 12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.fg{display:grid;gap:12px}
.fg label{display:grid;gap:5px;font-weight:700;font-size:14.5px}
.fg input,.fg select,.fg textarea{min-height:48px;border:1px solid #D3CBBE;border-radius:12px;padding:10px 12px;background:#fff;font-weight:500;width:100%}
.fg textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svcrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}
.svcrow .ico{width:48px;height:48px}
@media(max-width:520px){.svcrow{grid-template-columns:1fr auto}.svcrow label:first-child{grid-column:1/-1}}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times button{min-height:44px;min-width:70px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.times button[aria-pressed=true]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.warn{background:#FBEFE6;color:#7A3E1D;border-radius:12px;padding:12px 14px;font-size:14.5px}

function pad(n){return (n<10?'0':'')+n}

/* ---- beschikbaarheid ---- */
function staffFree(s, staffId, date, start, dur, ignoreId){
  var end=start+dur;
  for(var i=0;i<s.bookings.length;i++){var b=s.bookings[i];
    if(b.id===ignoreId||b.date!==date||b.staff!==staffId||b.status==='geannuleerd'||b.status==='geweigerd') continue;
    var bs=toMin(b.start), be=bs+b.dur; if(start<be&&end>bs) return false;}
  for(var j=0;j<s.blocks.length;j++){var k=s.blocks[j];
    if(k.date!==date||(k.staff!=='all'&&k.staff!==staffId)) continue;
    var ks=toMin(k.start), ke=toMin(k.end); if(start<ke&&end>ks) return false;}
  return true;
}
function canDo(st, skills){for(var i=0;i<skills.length;i++)if(st.s.indexOf(skills[i])<0)return false;return true}
/* geeft lijst {t:minuten, staff:[ids]} voor een datum */
function slotsFor(s, date, dur, skills, staffPref, now){
  var d=parseYmd(date), dow=d.getDay(), h=SOF.hours[dow]; if(!h) return [];
  if(s.closed.indexOf(date)>=0) return [];
  now=now||new Date(); var earliest=null;
  if(date===ymd(now)) earliest=now.getHours()*60+now.getMinutes()+SOF.minLeadMin;
  var open=toMin(h[0]), close=toMin(h[1]), out=[];
  var cands=s.staff.filter(function(st){return st.active!==false&&st.d.indexOf(dow)>=0&&canDo(st,skills)&&(!staffPref||st.id===staffPref)});
  for(var t=open;t+dur<=close;t+=SOF.step){
    if(earliest!==null&&t<earliest) continue;
    var free=cands.filter(function(st){return staffFree(s,st.id,date,t,dur)}).map(function(st){return st.id});
    if(free.length) out.push({t:t,staff:free});
  }
  return out;
}
function leastBusy(s, date, ids){
  var c={}; ids.forEach(function(i){c[i]=0});
  s.bookings.forEach(function(b){if(b.date===date&&c[b.staff]!==undefined&&b.status!=='geannuleerd')c[b.staff]+=b.dur});
  return ids.slice().sort(function(a,b){return c[a]-c[b]})[0];
}

}
function acceptReq(id){reload();var b=S.bookings.filter(function(x){return x.id===id})[0];if(!b)return;
 if(!staffFree(S,b.staff,b.date,toMin(b.start),b.dur,b.id)){toast(staffBy(b.staff).n+' is dan al bezet. Tik op Ander uur.');return}
 b.status='bevestigd';b.seen=true;b.confirmedAt=new Date().toISOString();save();closeD();draw();
 toast(b.name+' bevestigd.','Stuur bevestiging',waLink(b.phone,'Hallo '+b.name+', je afspraak bij '+SOF.short+' is bevestigd: '+fmtD(b.date)+' om '+b.start+' voor '+svcTxt(b)+' bij '+staffBy(b.staff).n+'. Adres: '+SOF.addrFor(b)+'. Tot dan!'))}
function declineReq(id){reload();var b=S.bookings.filter(function(x){return x.id===id})[0];if(!b)return;b.status='geweigerd';b.seen=true;save();closeD();draw();
 toast(b.name+': aanvraag geweigerd.','Laat klant weten',waLink(b.phone,'Hallo '+b.name+', bedankt voor je aanvraag bij '+SOF.short+'. Helaas zijn we op '+fmtD(b.date)+' om '+b.start+' volzet. Past een ander moment? Laat het ons weten, dan zoeken we samen iets.'))}
function setStatus(id,st){
 reload();var b=S.bookings.filter(function(x){return x.id===id})[0];var old=b.status;b.status=st;b.seen=true;save();closeD();draw();
 toast(b.name+': '+(st==='no-show'?'niet gekomen':st)+'.','Ongedaan maken',function(){reload();S.bookings.forEach(function(x){if(x.id===id)x.status=old});save();draw()});
 if(st==='geannuleerd'){var w=S.waitlist.filter(function(x){return x.date===b.date})[0];if(w)setTimeout(function(){toast('Plaats vrij! '+w.name+' staat op de wachtlijst voor deze dag.','WhatsApp '+w.name,waLink(w.phone,'Hallo '+w.name+', er is een plaats vrijgekomen bij '+SOF.short+' op '+fmtD(b.date)+' om '+b.start+'. Wil je ze?'))},3400)}
}

/* ---------- NIEUWE AFSPRAAK / WALK-IN ---------- */
function catOpts(sel){return MENU.map(function(g,i){return '<option value="'+i+'" '+(String(i)===String(sel)?'selected':'')+'>'+esc(g.cat)+'</option>'}).join('')}
function svcOpts(ci,sel){var g=MENU[ci];return g.items.map(function(s){return s.o.map(function(o,j){var v=s.id+'|'+j;return '<option value="'+v+'" '+(v===sel?'selected':'')+'>'+esc(s.n+(o.n?' · '+o.n:''))+' — '+durTxt(o.m)+' · '+eur(o.p)+'</option>'}).join('')}).join('')}
function catOf(v){var id=v.split('|')[0];for(var i=0;i<MENU.length;i++)if(MENU[i].items.some(function(s){return s.id===id}))return i;return 0}
function svcFrom(v){var a=v.split('|'),f=findSvc(a[0]),o=f.s.o[+a[1]]||f.s.o[0];return {id:f.s.id,o:+a[1],k:f.g.k,cat:f.g.cat,n:f.s.n+(o.n?' · '+o.n:''),m:o.m,p:o.p}}
function newAppt(p,walk){
 p=p||{};reload();
 var DEF=(findSvc('gellak')?'gellak':MENU[0].items[0].id)+'|0';var sel=(p.sel&&p.sel.length?p.sel:[p.svc||DEF]).filter(function(v){return findSvc(v.split('|')[0])});if(!sel.length)sel=[DEF];
 var names={};S.bookings.forEach(function(b){if(b.phone&&b.name)names[b.name+' · '+b.phone]=1});
 var h='<div class="fg">';
 h+='<div class="two"><label>Naam klant<input id="nN" list="cl" value="'+esc(p.name||'')+'" autocomplete="off" placeholder="'+(walk?'Optioneel':'Voornaam')+'"></label><label>Gsm<input id="nG" type="tel" inputmode="tel" value="'+esc(p.phone||'')+'" placeholder="0470 12 34 56"></label></div><datalist id="cl">'+Object.keys(names).slice(0,500).map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist><div id="cI"></div>';
 h+='<div id="svcs"></div><button type="button" class="lnk" id="addS" style="justify-self:start">+ Nog een behandeling</button>';
 h+='<label>Specialiste<select id="nP"></select></label>';
 if(!walk)h+='<label>Dag<input type="date" id="nD" value="'+(p.date&&p.date>=today?p.date:today)+'"></label><div><b style="font-size:14.5px">Vrij uur</b><div class="times" id="nT" style="margin-top:6px"></div></div>';
 h+='<div id="nI"></div><label>Opmerking <span style="font-weight:500;color:var(--soft)">(optioneel)</span><textarea id="nO"></textarea></label><button class="btn g" id="nSave" style="min-height:56px;font-size:17px">'+(walk?'Walk-in nu inplannen':'Afspraak bewaren')+'</button></div>';
 drawer(walk?'Walk-in':'Nieuwe afspraak',h);
 var pick=typeof p.time==='number'?p.time:null;
 function drawSvcs(){$('#svcs').innerHTML=sel.map(function(v,i){var ci=catOf(v);return '<div class="svcrow" data-i="'+i+'"><label>Categorie<select class="sc">'+catOpts(ci)+'</select></label><label>Behandeling'+(i?' '+(i+1):'')+'<select class="ss">'+svcOpts(ci,v)+'</select></label>'+(sel.length>1?'<button type="button" class="ico rm" aria-label="Verwijder behandeling">×</button>':'<span></span>')+'</div>'}).join('');
  $$('#svcs .svcrow').forEach(function(r){var i=+r.dataset.i;
   $('.sc',r).onchange=function(){var g=MENU[+this.value];sel[i]=g.items[0].id+'|0';drawSvcs();calc()};
   $('.ss',r).onchange=function(){sel[i]=this.value;calc()};
   var rm=$('.rm',r);if(rm)rm.onclick=function(){sel.splice(i,1);drawSvcs();calc()};});
  $('#addS').style.display=sel.length>=3?'none':''}
 function items(){return sel.map(svcFrom)}
 function skills(){return items().map(function(x){return x.k}).filter(function(v,i,a){return a.indexOf(v)===i})}
 function dur(){return items().reduce(function(s,x){return s+x.m},0)}
 function staffOpts(){var sk=skills(),cur0=$('#nP')?$('#nP').value:(p.staff||(isOwner()?'':ME.id));
  var l=S.staff.filter(function(s){return s.active!==false&&canDo(s,sk)&&(isOwner()||s.id===ME.id)});
  $('#nP').innerHTML=(isOwner()?'<option value="">Eerst beschikbare</option>':'')+l.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')+(l.length?'':'<option value="" disabled>Niemand doet deze combinatie</option>');
  if(l.some(function(s){return s.id===cur0}))$('#nP').value=cur0}
 function calc(){reload();staffOpts();var pref=$('#nP').value||null,d=dur(),sk=skills();
  if(walk){var now=new Date(),t0=Math.ceil(nowMin()/15)*15,sl=dayClosed(today)?null:slotsFor(S,today,d,sk,pref,new Date(now.getTime()-SOF.minLeadMin*60000)).filter(function(x){return x.t>=t0})[0];
   $('#nI').innerHTML=sl?'<div class="info">Eerst vrij: <b>vandaag om '+toHM(sl.t)+'</b> bij <b>'+esc(staffBy(pref||leastBusy(S,today,sl.staff)).n)+'</b> · '+durTxt(d)+' · '+eur(items().reduce(function(s,x){return s+x.p},0))+'</div>':'<div class="warn">'+(dayClosed(today)?'Vandaag is de salon gesloten.':'Vandaag is er niemand meer vrij voor deze behandeling.')+'</div>';return sl}
  var dd=$('#nD').value;
  if(dayClosed(dd)){$('#nT').innerHTML='';$('#nI').innerHTML='<div class="warn">Op deze dag is de salon gesloten.</div>';pick=null;return}
  var sl2=slotsFor(S,dd,d,sk,pref,new Date(0));
  if(dd===today){var t0=nowMin();sl2=sl2.filter(function(x){return x.t>=t0-15})}
  if(pick!==null&&!sl2.some(function(x){return x.t===pick}))pick=null;
  $('#nT').innerHTML=sl2.map(function(x){return '<button type="button" data-t="'+x.t+'" aria-pressed="'+(x.t===pick)+'">'+toHM(x.t)+'</button>'}).join('');
  $('#nI').innerHTML=sl2.length?'<div class="info">'+durTxt(d)+' · '+eur(items().reduce(function(s,x){return s+x.p},0))+(pick===null?' · kies een uur':' · '+toHM(pick))+'</div>':'<div class="warn">Geen vrij uur op deze dag'+(pref?' voor '+esc(staffBy(pref).n):'')+'. Probeer een andere dag.</div>';
  $$('#nT button').forEach(function(x){x.onclick=function(){pick=+x.dataset.t;calc()}});}
 function custInfo(){var ph=$('#nG').value,k=phoneKey(ph);if(k.length<10){$('#cI').innerHTML='';return}
  var c=custList().filter(function(x){return x.k===k})[0];if(!c){$('#cI').innerHTML='<div class="info">Nieuwe klant.</div>';return}
  var nt=(S.customers[k]||{}).notes;$('#cI').innerHTML='<div class="'+(c.ns>=2?'warn':'info')+'">Vaste klant: '+c.visits+' bezoeken'+(c.ns?' · '+c.ns+'× no-show':'')+(c.ns>=2?'. Vraag een voorschot.':'')+(nt?'<br>📝 '+esc(nt):'')+'</div>';if(!$('#nN').value)$('#nN').value=c.name}
 $('#nN').oninput=function(){var v=this.value,m=v.match(/^(.*) · (\+?[\d ]+)$/);if(m){this.value=m[1];$('#nG').value=m[2];custInfo()}};
 $('#nG').oninput=custInfo;
 drawSvcs();calc();custInfo();
 $('#addS').onclick=function(){sel.push(sel[sel.length-1]);drawSvcs();calc()};
 $('#nP').onchange=calc;if(!walk)$('#nD').onchange=function(){pick=null;calc()};
 $('#nSave').onclick=function(){
  var it=items(),name=$('#nN').value.trim()||(walk?'Walk-in':''),ph=$('#nG').value.trim(),pref=$('#nP').value||null,d=dur(),sk=skills(),date,t,staff;
  if(!name){toast('Vul de naam van de klant in.');$('#nN').focus();return}
  if(!walk&&!ph){toast('Vul een gsm-nummer in, dan kan je de klant een herinnering sturen.');$('#nG').focus();return}
  if(walk){var sl=calc();if(!sl){toast('Niemand vrij vandaag.');return}date=today;t=sl.t;staff=pref||leastBusy(S,today,sl.staff)}
  else{date=$('#nD').value;if(pick===null){toast('Kies eerst een vrij uur.');return}reload();var f=slotsFor(S,date,d,sk,pref,new Date(0)).filter(function(x){return x.t===pick})[0];if(!f){toast('Dat uur is niet meer vrij.');calc();return}t=pick;staff=pref||leastBusy(S,date,f.staff)}
  reload();S.bookings.push({id:uid(),created:new Date().toISOString(),date:date,start:toHM(t),dur:d,staff:staff,services:it,total:it.reduce(function(s,x){return s+x.p},0),name:name,phone:ph,email:'',note:$('#nO').value.trim(),status:'bevestigd',source:walk?'walk-in':'telefoon',seen:true,by:ME.id||'owner'});
  if(p.fromWait)S.waitlist=S.waitlist.filter(function(w){return w.id!==p.fromWait});
  save();closeD();cur=date;if(view!=='agenda')view='vandaag';draw();toast((walk?'Walk-in':'Afspraak')+' ingepland: '+fmtS(date)+' om '+toHM(t)+' bij '+staffBy(staff).n+'.')};
}
function openBlock(id){
 reload();var k=id?S.blocks.filter(function(x){return x.id===id})[0]:null;
 var times='';for(var t=540;t<=1140;t+=15)times+='<option>'+toHM(t)+'</option>';
 var h='<div class="fg"><label>Wie<select id="bS">'+(isOwner()?'<option value="all">Hele salon</option>'+S.staff.filter(function(s){return s.active!==false}).map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join(''):'<option value="'+ME.id+'">'+esc(staffBy(ME.id).n)+'</option>')+'</select></label><label>Dag<input type="date" id="bD" value="'+(k?k.date:cur)+'"></label><div class="two"><label>Van<select id="bF">'+times+'</select></label><label>Tot<select id="bT">'+times+'</select></label></div><label>Reden<select id="bR"><option>Lunch</option><option>Pauze</option><option>Afwezig</option><option>Opleiding</option><option>Dokter</option><option>Andere</option></select></label><button class="btn" id="bSave">'+(k?'Wijzig':'Blokkeer')+'</button>'+(k?'<button class="btn r" id="bDel">Blokkering verwijderen</button>':'')+'</div>';
 drawer(k?'Blokkering':'Pauze / tijd blokkeren',h);
 $('#bS').value=k?k.staff:(isOwner()?'all':ME.id);$('#bF').value=k?k.start:'12:30';$('#bT').value=k?k.end:'13:00';if(k&&k.reason)$('#bR').value=k.reason;
 $('#bSave').onclick=function(){var f=$('#bF').value,t=$('#bT').value;if(toMin(t)<=toMin(f)){toast('Het einduur moet na het beginuur liggen.');return}reload();
  var o={id:k?k.id:uid(),date:$('#bD').value,start:f,end:t,staff:$('#bS').value,reason:$('#bR').value};
  S.blocks=S.blocks.filter(function(x){return x.id!==o.id}).concat([o]);save();closeD();cur=o.date;draw();
  var n=S.bookings.filter(function(b){return b.date===o.date&&live(b)&&(o.staff==='all'||b.staff===o.staff)&&toMin(b.start)<toMin(o.end)&&toMin(b.start)+b.dur>toMin(o.start)}).length;
  toast(n?'Geblokkeerd. Let op: er overlappen '+n+' afspraken.':o.reason+' ingepland van '+f+' tot '+t+'.')};
 if(k)$('#bDel').onclick=function(){reload();S.blocks=S.blocks.filter(function(x){return x.id!==k.id});save();closeD();draw();toast('Blokkering verwijderd.')};
}

/* ---------- live: nieuwe online boekingen ---------- */
var known={};S.bookings.forEach(function(b){known[b.id]=1});
window.addEventListener('storage',function(e){
 if(e.key!==STORE_KEY&&e.key!==SOF.webKey)return;reload();
 var nw=S.bookings.filter(function(b){return !known[b.id]});S.bookings.forEach(function(b){known[b.id]=1});
 if(!$('#app').classList.contains('on'))return;
 if(!$('#drw').classList.contains('on'))draw();else nav();
 nw.filter(mine).forEach(function(b){toast((isReq(b)?'Nieuwe aanvraag: ':'Nieuwe online boeking: ')+b.name+', '+fmtS(b.date)+' om '+b.start,'Bekijk',function(){cur=b.date;openAppt(b.id)})});
});
setInterval(function(){today=ymd(new Date());if((view==='vandaag'||view==='agenda')&&cur===today&&!$('#drw').classList.contains('on')&&$('#app').classList.contains('on'))draw()},60000);
})();
</script>
